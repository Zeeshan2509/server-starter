name: Auto Run

on:
  repository_dispatch:
    types: [Cron-Job]
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get Playwright Version
        id: pw-version
        run: |
          pip install --upgrade pip
          LATEST_PW=$(curl -s https://pypi.org/pypi/playwright/json | jq -r .info.version)
          echo "version=$LATEST_PW" >> $GITHUB_OUTPUT

      - name: Restore Cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Dependencies
        run: |
          # Disable background unattended updates to avoid dpkg lock contention
          sudo systemctl stop unattended-upgrades || true
          sudo systemctl disable unattended-upgrades || true
          
          # Wait for any active apt/dpkg locks to release
          while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock >/dev/null 2>&1; do
            echo "Waiting for dpkg/apt lock..."
            sleep 2
          done

          export DEBIAN_FRONTEND=noninteractive
          export NEEDRESTART_MODE=a

          pip install playwright==${{ steps.pw-version.outputs.version }} requests
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != 'true' ]; then
            playwright install --with-deps chromium
          else
            playwright install-deps chromium
          fi

          # Pre-install networking packages needed by warp-on-actions to prevent apt contention
          sudo apt-get update && sudo -E apt-get install -y --no-install-recommends \
            wireguard wireguard-tools curl net-tools iproute2 resolvconf dnsutils iptables
          
      - name: Connect VPN
        uses: fscarmen/warp-on-actions@v1.1

      - name: Fix DNS
        run: |
          sudo sed -i 's/nameserver.*/nameserver 8.8.8.8/' /etc/resolv.conf
          echo "✓ DNS set to 8.8.8.8"

      - name: Start Bot
        env:
          PYTHONUNBUFFERED: "1"
          GH_PAT: ${{ secrets.GH_PAT }}
          CENTRAL_REPO: ${{ secrets.CENTRAL_REPO }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ATERNOS_USER: ${{ secrets.ATERNOS_USER }}
          ATERNOS_PASS: ${{ secrets.ATERNOS_PASS }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: python3 bot.py

      - name: Upload Artifacts (Screenshots on Failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-starter-screenshots
          path: artifacts/
          retention-days: 5
          if-no-files-found: ignore
